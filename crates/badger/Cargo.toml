[package]
name = "badger"
description = "A Rust port of the Badger key-value store, on-disk compatible with Go Badger v4.9.6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.9.2"
crc32c = "0.6.9"
ctr = "0.10.1"
flatbuffers = "=25.2.10"  # same version as Go Badger v4.9.6
getrandom = "0.4.3"
prost = "0.14.6"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }

[dev-dependencies]
badger-fixtures.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
